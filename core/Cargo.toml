[package]
name = "transliterator"
version = "0.1.0"
edition = "2021"
authors = ["Unsigned Labs"]
description = "Rust transliteration engine for Indian languages"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[lib]
crate-type = ["cdylib", "rlib"]
