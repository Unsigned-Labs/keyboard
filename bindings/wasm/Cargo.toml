[package]
name = "transliterator-wasm"
version = "0.1.0"
edition = "2021"
authors = ["Unsigned Labs"]
description = "WebAssembly bindings for transliterator"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
transliterator = { path = "../../core" }
wasm-bindgen = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde-wasm-bindgen = "0.6"

[dev-dependencies]
wasm-bindgen-test = "0.3"
