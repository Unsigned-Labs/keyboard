[package]
name = "unsigned-ime"
version = "0.1.0"
edition = "2021"
authors = ["Unsigned Labs"]
description = "IBus input method engine for Indian languages"
license = "MIT"

[[bin]]
name = "ibus-engine-unsigned"
path = "src/main.rs"

[dependencies]
transliterator = { path = "../../core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
